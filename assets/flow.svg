<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="The architect sends specs to Sol and consults to the advisor. Reports and verdicts come back.">
  <defs>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ab4f8"/>
    </marker>
    <marker id="m-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8945e"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 600; }
      .sub   { font-size: 14px; fill: #8b949e; }
      .lab   { font-size: 14px; font-weight: 500; }
      .tab   { font-size: 13px; fill: #8b949e; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="900" height="280" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="40" rx="14" fill="#161b22"/>
  <rect x="0" y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="tab">herdr · one workspace, three tabs</text>
  <line x1="0" y1="40" x2="900" y2="40" stroke="#30363d"/>

  <!-- Sol -->
  <rect x="50" y="105" width="200" height="110" rx="12" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
  <text x="150" y="153" text-anchor="middle" class="title" fill="#4ade80">Sol</text>
  <text x="150" y="181" text-anchor="middle" class="sub">Codex · writes the code</text>

  <!-- Architect -->
  <rect x="350" y="105" width="200" height="110" rx="12" fill="#161b22" stroke="#8ab4f8" stroke-width="2"/>
  <text x="450" y="153" text-anchor="middle" class="title" fill="#8ab4f8">Architect</text>
  <text x="450" y="181" text-anchor="middle" class="sub">you · writes the specs</text>

  <!-- Advisor -->
  <rect x="650" y="105" width="200" height="110" rx="12" fill="#161b22" stroke="#e8945e" stroke-width="2"/>
  <text x="750" y="153" text-anchor="middle" class="title" fill="#e8945e">Advisor</text>
  <text x="750" y="181" text-anchor="middle" class="sub">Fable · reviews the result</text>

  <!-- Architect -> Sol : spec -->
  <line x1="350" y1="135" x2="252" y2="135" stroke="#8ab4f8" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="300" y="125" text-anchor="middle" class="lab" fill="#8ab4f8">spec</text>

  <!-- Sol -> Architect : report -->
  <line x1="250" y1="185" x2="348" y2="185" stroke="#4ade80" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="300" y="207" text-anchor="middle" class="lab" fill="#4ade80">report</text>

  <!-- Architect -> Advisor : consult -->
  <line x1="550" y1="135" x2="648" y2="135" stroke="#8ab4f8" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="600" y="125" text-anchor="middle" class="lab" fill="#8ab4f8">consult</text>

  <!-- Advisor -> Architect : verdict -->
  <line x1="650" y1="185" x2="552" y2="185" stroke="#e8945e" stroke-width="2" marker-end="url(#m-clay)"/>
  <text x="600" y="207" text-anchor="middle" class="lab" fill="#e8945e">verdict</text>

</svg>
